
name: Build BlockParty

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bundled music changes
        id: music_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_range="$BASE_SHA...$GITHUB_SHA"
          else
            diff_range="$BEFORE_SHA"
            if [[ -z "$diff_range" || "$diff_range" =~ ^0+$ ]]; then
              diff_range="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            if [[ -z "$diff_range" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            diff_range="$diff_range $GITHUB_SHA"
          fi
          if git diff --name-only $diff_range | grep -Eq '^BlockParty-NeoForge-1[.]21[.]1/src/main/resources/assets/(blockparty/sounds/music/.*[.]ogg|blockparty_music/sounds[.]json|blockparty/music_durations[.]properties)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Normalize bundled music for Minecraft Vorbis playback
        if: steps.music_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          assets_dir="BlockParty-NeoForge-1.21.1/src/main/resources/assets"
          asset_dir="$assets_dir/blockparty"
          music_dir="$asset_dir/sounds/music"
          music_events="$assets_dir/blockparty_music/sounds.json"
          duration_file="$asset_dir/music_durations.properties"
          tracks=(
            bangerfabrikken:bangerfabrikken.ogg
            odin_moon:odin_moon.ogg
            stille_anders:stille_anders.ogg
            hjulene_pa_bussen_olli:hjulene_pa_bussen_olli.ogg
            odin_terrorist:odin_terrorist.ogg
            exige_2014_launchpad_mix:exige_2014_launchpad_mix.ogg
            hau_hau_hau:hau_hau_hau.ogg
            fest_hos_toby:fest_hos_toby.ogg
            konfliktpartiet:konfliktpartiet.ogg
            hms_er_best:hms_er_best.ogg
            stianorway_damer_objekter:stianorway_damer_objekter.ogg
            stianorway_vi_maa_ikke_si_et_ord:stianorway_vi_maa_ikke_si_et_ord.ogg
            luxus_leverpostei_plastisk_kirurgi:luxus_leverpostei_plastisk_kirurgi.ogg
            kaptein_sabeltann_pinkys_sang:kaptein_sabeltann_pinkys_sang.ogg
            luxus_leverpostei_195:luxus_leverpostei_195.ogg
            luxus_leverpostei_sur_mus:luxus_leverpostei_sur_mus.ogg
            oingo_boingo_little_girls_pedobear:oingo_boingo_little_girls_pedobear.ogg
            inni_hodet_ditt:inni_hodet_ditt.ogg
          )

          printf "# Measured from the final, normalized OGG files by FFprobe.\n" > "$duration_file"
          for entry in "${tracks[@]}"; do
            IFS=: read -r track_id track_file <<< "$entry"
            input="$music_dir/$track_file"
            output="$music_dir/${track_file%.ogg}.normalized.ogg"
            decode_log="$RUNNER_TEMP/${track_id}-decode.log"
            test -s "$input"

            # Put every official track into the same stereo Vorbis profile and loudness range.
            ffmpeg -hide_banner -loglevel error -y -i "$input" \
              -map 0:a:0 -vn -map_metadata -1 \
              -af "loudnorm=I=-14:TP=-1.0:LRA=11" -ac 2 -ar 44100 \
              -c:a libvorbis -b:a 128k "$output"
            test -s "$output"
            mv "$output" "$input"

            codec_info="$(ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$input")"
            if [[ "$codec_info" != "vorbis,44100,2" ]]; then
              echo "Unexpected normalized audio format for $track_file: $codec_info" >&2
              exit 1
            fi

            # Decode the complete OGG and reject empty or silent tracks.
            ffmpeg -hide_banner -nostats -v info -i "$input" -af volumedetect -f null - 2> "$decode_log"
            mean_volume="$(sed -n "s/.*mean_volume: //p" "$decode_log" | tail -n 1 | awk "{print \$1}")"
            if [[ -z "$mean_volume" || "$mean_volume" == "-inf" ]]; then
              echo "No decodable audio signal found in $track_file" >&2
              cat "$decode_log" >&2
              exit 1
            fi

            duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input")"
            awk -v d="$duration" "BEGIN { exit !(d > 0 && d < 3600) }"
            duration_seconds="$(awk -v d="$duration" "BEGIN { printf \"%.3f\", d }")"
            printf "%s=%s\n" "$track_id" "$duration_seconds" >> "$duration_file"
            echo "Validated $track_file: $codec_info, ${duration_seconds}s, mean volume ${mean_volume}dB"
          done

          # Ensure every dedicated built-in music event maps to its matching packaged OGG.
          python3 - "$music_events" "$music_dir" <<'PY'
          import json, pathlib, sys
          sound_manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          music_dir = pathlib.Path(sys.argv[2])
          tracks = [
              "bangerfabrikken", "odin_moon", "stille_anders", "hjulene_pa_bussen_olli",
              "odin_terrorist", "exige_2014_launchpad_mix", "hau_hau_hau", "fest_hos_toby",
              "konfliktpartiet", "hms_er_best",
              "stianorway_damer_objekter",
              "stianorway_vi_maa_ikke_si_et_ord",
              "luxus_leverpostei_plastisk_kirurgi",
              "kaptein_sabeltann_pinkys_sang",
              "luxus_leverpostei_195",
              "luxus_leverpostei_sur_mus",
              "oingo_boingo_little_girls_pedobear", "inni_hodet_ditt"
          ]
          for track in tracks:
              file = music_dir / f"{track}.ogg"
              event = sound_manifest.get(f"music_{track}")
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f"Missing bundled OGG: {file}")
              if event is None:
                  raise SystemExit(f"Missing sound event: music_{track}")
              names = [entry.get("name") for entry in event.get("sounds", []) if isinstance(entry, dict)]
              if f"blockparty:music/{track}" not in names:
                  raise SystemExit(f"Sound event music_{track} does not map to blockparty:music/{track}")
          print("All seventeen built-in BlockParty sound events map to packaged OGG tracks.")
          PY

      - name: Build BlockParty
        working-directory: BlockParty-NeoForge-1.21.1
        run: gradle build --no-daemon

      - name: Verify all built-in tracks are present in the finished JAR
        shell: bash
        working-directory: BlockParty-NeoForge-1.21.1
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name "blockparty-*.jar" ! -name "*sources*" | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" > "$RUNNER_TEMP/blockparty-jar-contents.txt"
          grep -Fxq "assets/blockparty/sounds.json" "$RUNNER_TEMP/blockparty-jar-contents.txt"
          grep -Fxq "assets/blockparty_music/sounds.json" "$RUNNER_TEMP/blockparty-jar-contents.txt"
          grep -Fxq "assets/blockparty/music_durations.properties" "$RUNNER_TEMP/blockparty-jar-contents.txt"
          for track in bangerfabrikken odin_moon stille_anders hjulene_pa_bussen_olli odin_terrorist exige_2014_launchpad_mix hau_hau_hau fest_hos_toby konfliktpartiet hms_er_best stianorway_damer_objekter stianorway_vi_maa_ikke_si_et_ord luxus_leverpostei_plastisk_kirurgi kaptein_sabeltann_pinkys_sang luxus_leverpostei_195 luxus_leverpostei_sur_mus oingo_boingo_little_girls_pedobear inni_hodet_ditt; do
            grep -Fxq "assets/blockparty/sounds/music/$track.ogg" "$RUNNER_TEMP/blockparty-jar-contents.txt"
          done
          echo "All seventeen built-in BlockParty tracks and the measured-duration manifest are packaged."

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockParty-NeoForge-1.21.1
          path: BlockParty-NeoForge-1.21.1/build/libs/*.jar
          if-no-files-found: error
