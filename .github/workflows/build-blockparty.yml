name: Build BlockParty

on:
  push:
    branches:
      - main
      - fix/xmas-displays-spectator
      - fix/xmas-1-1-6-screen-spectator-border
      - fix/1-1-7-xmas-screen-adventure-spectators
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify integrated BlockParty features
        shell: bash
        run: |
          set -euo pipefail
          arena="BlockParty-NeoForge-1.21.1/src/main/java/no/bangerfabrikken/blockparty/arena/Arena.java"
          schematic="BlockParty-NeoForge-1.21.1/src/main/java/no/bangerfabrikken/blockparty/arena/SchematicArenaGenerator.java"
          test -s "$arena"
          test -s "$schematic"
          test -s BlockParty-NeoForge-1.21.1/src/main/resources/assets/blockparty/schematics/xmas.schem.b64
          test -s BlockParty-NeoForge-1.21.1/src/main/java/no/bangerfabrikken/blockparty/arena/GameModeMenu.java
          test -s BlockParty-NeoForge-1.21.1/src/main/java/no/bangerfabrikken/blockparty/arena/DailyChallengeMenu.java
          grep -q 'trimLobbySideBorder' "$schematic"
          grep -q 'placeNonPlayableLobbyEdge' "$schematic"
          grep -q 'Blocks.BARRIER' "$schematic"
          grep -q 'MEMORY_FIND_TICKS = 140' "$arena"
          grep -q 'MEMORY_FINAL_COUNTDOWN_TICKS = 40' "$arena"
          grep -q 'preferredGameModes.clear()' "$arena"
          grep -q 'showMemoryTargetToPlayers(server)' "$arena"
          grep -q 'HUSK DENNE FARGEN:' "$arena"
          grep -q 'clearMemoryTargetItems(server)' "$arena"
          grep -q 'startMemoryFind(server)' "$arena"
          grep -q 'screenBaseY += 4' "$arena"
          grep -q 'roofDistance' "$arena"
          grep -q 'ÅPNE BOKA FOR Å STEMME' "$arena"
          grep -q 'MEMORY_REVEAL' "$arena"
          grep -q 'tickColorScanners(server)' "$arena"
          grep -q 'ensureXmasLeftBorder()' "$arena"
          grep -q 'spawnTextDisplay(level, x, y, z, 0.0F' "$arena"
          grep -q 'eliminatedPlayers.add(uuid)' "$arena"
          grep -q 'GameType.ADVENTURE' "$arena"
          grep -q 'isArenaColorAccent(state)' "$arena"
          grep -q 'int column = i / 5;' "$arena"
          grep -q 'screenBaseY + 0.2' "$arena"
          grep -q 'double y = floorY + 14.5;' "$arena"
          grep -q 'showTarget ? 16.0F : 16.0F' "$arena"
          grep -q 'showBetweenRoundTarget' "$arena"
          grep -q 'normalizeSnowApron' "$schematic"
          grep -q 'restoreMainArenaScreenPanel' "$arena"
          grep -q 'isInsideMainArenaScreenPanel(pos)' "$arena"
          grep -q 'support.is(Blocks.SNOW_BLOCK)' "$schematic"
          grep -q 'color == null || "xmas".equals(id)' "$arena"
          grep -q 'revealMemoryTarget' "$arena"

      - name: Normalize and validate playlist music
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          assets_dir="BlockParty-NeoForge-1.21.1/src/main/resources/assets"
          asset_dir="$assets_dir/blockparty"
          music_dir="$asset_dir/sounds/music"
          music_events="$assets_dir/blockparty_music/sounds.json"
          playlist_file="$asset_dir/music_playlist.json"
          duration_file="$asset_dir/music_durations.properties"
          track_ids_file="$RUNNER_TEMP/blockparty-track-ids.txt"

          # Read the playlist manifest as the single source of truth. This removes the
          # per-song hard-coded lists that previously had to be updated in this workflow.
          python3 - "$playlist_file" "$music_events" "$music_dir" > "$track_ids_file" <<'PY'
          import json, pathlib, re, sys
          playlist_path, sound_events_path, music_dir = map(pathlib.Path, sys.argv[1:])
          playlist = json.loads(playlist_path.read_text(encoding="utf-8"))
          sound_events = json.loads(sound_events_path.read_text(encoding="utf-8"))
          tracks = playlist.get("tracks")
          if not isinstance(tracks, list) or not tracks:
              raise SystemExit("music_playlist.json must contain a non-empty tracks array")
          if len(tracks) > 27:
              raise SystemExit(f"Playlist has {len(tracks)} tracks; the voting menu supports 27")
          seen = set()
          for entry in tracks:
              if not isinstance(entry, dict):
                  raise SystemExit("Every playlist track must be a JSON object")
              track_id = entry.get("id", "")
              if not isinstance(track_id, str) or not re.fullmatch(r"[a-z0-9_]{1,48}", track_id):
                  raise SystemExit(f"Invalid track id: {track_id!r}")
              if track_id in seen:
                  raise SystemExit(f"Duplicate track id: {track_id}")
              seen.add(track_id)
              for field in ("name", "artist"):
                  if not isinstance(entry.get(field), str) or not entry[field].strip():
                      raise SystemExit(f"Track {track_id} needs a non-empty {field}")
              bpm = entry.get("bpm", 0)
              if not isinstance(bpm, int) or bpm < 0 or bpm > 400:
                  raise SystemExit(f"Track {track_id} has an invalid bpm value: {bpm!r}")
              audio_file = music_dir / f"{track_id}.ogg"
              if not audio_file.is_file() or audio_file.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty playlist audio file: {audio_file}")
              event_name = f"music_{track_id}"
              event = sound_events.get(event_name)
              if event is None:
                  raise SystemExit(f"Missing registered sound definition: {event_name}")
              names = [sound.get("name") for sound in event.get("sounds", []) if isinstance(sound, dict)]
              if f"blockparty:music/{track_id}" not in names:
                  raise SystemExit(f"{event_name} must map to blockparty:music/{track_id}")
              print(track_id)

          # All eight custom slots are pre-wired and ready to use. Only slots listed
          # in music_playlist.json become selectable songs.
          for slot in range(1, 9):
              track_id = f"custom_{slot}"
              event = sound_events.get(f"music_{track_id}")
              names = [sound.get("name") for sound in event.get("sounds", []) if isinstance(sound, dict)] if event else []
              if f"blockparty:music/{track_id}" not in names:
                  raise SystemExit(f"Custom slot {track_id} is not correctly pre-wired")
          PY

          mapfile -t tracks < "$track_ids_file"
          if [[ ${#tracks[@]} -eq 0 ]]; then
            echo "No active playlist tracks were found." >&2
            exit 1
          fi

          printf "# Measured from the final, normalized OGG files by FFprobe.\n" > "$duration_file"
          for track_id in "${tracks[@]}"; do
            input="$music_dir/$track_id.ogg"
            output="$music_dir/$track_id.normalized.ogg"
            decode_log="$RUNNER_TEMP/$track_id-decode.log"

            # Put every enabled track into the same stereo Vorbis profile and loudness range.
            ffmpeg -hide_banner -loglevel error -y -i "$input" \
              -map 0:a:0 -vn -map_metadata -1 \
              -af "loudnorm=I=-14:TP=-1.0:LRA=11" -ac 2 -ar 44100 \
              -c:a libvorbis -q:a 5 "$output"
            test -s "$output"
            mv "$output" "$input"

            codec_info="$(ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$input")"
            if [[ "$codec_info" != "vorbis,44100,2" ]]; then
              echo "Unexpected normalized audio format for $track_id.ogg: $codec_info" >&2
              exit 1
            fi

            # Decode the complete OGG and reject empty or silent tracks.
            ffmpeg -hide_banner -nostats -v info -i "$input" -af volumedetect -f null - 2> "$decode_log"
            mean_volume="$(sed -n 's/.*mean_volume: //p' "$decode_log" | tail -n 1 | awk '{print $1}')"
            if [[ -z "$mean_volume" || "$mean_volume" == "-inf" ]]; then
              echo "No decodable audio signal found in $track_id.ogg" >&2
              cat "$decode_log" >&2
              exit 1
            fi

            duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input")"
            awk -v d="$duration" 'BEGIN { exit !(d > 0 && d < 3600) }'
            duration_seconds="$(awk -v d="$duration" 'BEGIN { printf "%.3f", d }')"
            printf "%s=%s\n" "$track_id" "$duration_seconds" >> "$duration_file"
            echo "Validated $track_id.ogg: $codec_info, ${duration_seconds}s, mean volume ${mean_volume}dB"
          done

      - name: Build BlockParty
        working-directory: BlockParty-NeoForge-1.21.1
        run: gradle build --no-daemon

      - name: Verify playlist assets in the finished JAR
        shell: bash
        working-directory: BlockParty-NeoForge-1.21.1
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name "blockparty-*.jar" ! -name "*sources*" | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" > "$RUNNER_TEMP/blockparty-jar-contents.txt"
          grep -Fxq "assets/blockparty/sounds.json" "$RUNNER_TEMP/blockparty-jar-contents.txt"
          grep -Fxq "assets/blockparty_music/sounds.json" "$RUNNER_TEMP/blockparty-jar-contents.txt"
          grep -Fxq "assets/blockparty/music_playlist.json" "$RUNNER_TEMP/blockparty-jar-contents.txt"
          grep -Fxq "assets/blockparty/music_durations.properties" "$RUNNER_TEMP/blockparty-jar-contents.txt"
          grep -Fxq "assets/blockparty/schematics/xmas.schem.b64" "$RUNNER_TEMP/blockparty-jar-contents.txt"

          python3 - "$RUNNER_TEMP/blockparty-jar-contents.txt" <<'PY'
          import json, pathlib, sys
          contents = set(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines())
          playlist = json.loads(pathlib.Path("src/main/resources/assets/blockparty/music_playlist.json").read_text(encoding="utf-8"))
          tracks = playlist["tracks"]
          for entry in tracks:
              asset = f"assets/blockparty/sounds/music/{entry['id']}.ogg"
              if asset not in contents:
                  raise SystemExit(f"Missing active music track from finished JAR: {asset}")
          print(f"Verified all {len(tracks)} active playlist tracks and the playlist manifest in the final JAR.")
          PY

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockParty-NeoForge-1.21.1
          path: BlockParty-NeoForge-1.21.1/build/libs/*.jar
          if-no-files-found: error
