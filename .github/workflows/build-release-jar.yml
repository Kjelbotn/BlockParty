name: Build BlockParty Release JAR

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/xmas-arena
      - fix/1-1-7-xmas-screen-adventure-spectators
      - fix/xmas-display-entity-fps-1-4-8
      - release/1.4.19
      - release/1.4.20
      - release/1.4.21
      - release/1.4.22
      - release/1.4.23
      - release/1.4.24
      - release/1.4.25
      - release/1.4.26
      - feature/1.4.35-feedback-chat-lobby-stats

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify required release files
        shell: bash
        run: |
          set -euo pipefail
          test -s BlockParty-NeoForge-1.21.1/gradle.properties
          test -s BlockParty-NeoForge-1.21.1/src/main/java/no/bangerfabrikken/blockparty/arena/Arena.java
          test -s BlockParty-NeoForge-1.21.1/src/main/java/no/bangerfabrikken/blockparty/arena/SchematicArenaGenerator.java
          test -s BlockParty-NeoForge-1.21.1/src/main/java/no/bangerfabrikken/blockparty/arena/MusicVotingMenu.java
          test -s BlockParty-NeoForge-1.21.1/src/main/resources/assets/blockparty/schematics/xmas.schem.b64
      - name: Normalize and validate all playlist audio
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          assets_dir="BlockParty-NeoForge-1.21.1/src/main/resources/assets"
          music_dir="$assets_dir/blockparty/sounds/music"
          event_file="$assets_dir/blockparty_music/sounds.json"
          duration_file="$assets_dir/blockparty/music_durations.properties"
          ids_file="$RUNNER_TEMP/release-track-ids.txt"
          python3 - "$assets_dir/blockparty/music_playlist.json" "$assets_dir/blockparty/xmas_music_playlist.json" "$event_file" "$music_dir" > "$ids_file" <<'PY'
          import json, pathlib, re, sys
          main_path, xmas_path, event_path, music_dir = map(pathlib.Path, sys.argv[1:])
          events = json.loads(event_path.read_text(encoding="utf-8"))
          seen = set()
          for manifest_path in (main_path, xmas_path):
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              tracks = manifest.get("tracks")
              if not isinstance(tracks, list) or not tracks:
                  raise SystemExit(f"{manifest_path.name} has no tracks")
              if len(tracks) > 27:
                  raise SystemExit(f"{manifest_path.name} exceeds the 27-track menu limit")
              for track in tracks:
                  track_id = track.get("id", "")
                  if not isinstance(track_id, str) or not re.fullmatch(r"[a-z0-9_]{1,48}", track_id):
                      raise SystemExit(f"Invalid track id: {track_id!r}")
                  if track_id in seen:
                      raise SystemExit(f"Duplicate track id: {track_id}")
                  seen.add(track_id)
                  if not track.get("name", "").strip() or not track.get("artist", "").strip():
                      raise SystemExit(f"Track {track_id} has no name or artist")
                  audio = music_dir / f"{track_id}.ogg"
                  if not audio.is_file() or audio.stat().st_size == 0:
                      raise SystemExit(f"Missing/empty audio: {audio}")
                  event_name = f"music_{track_id}"
                  event = events.get(event_name)
                  sounds = event.get("sounds", []) if event else []
                  names = [s.get("name") for s in sounds if isinstance(s, dict)]
                  if f"blockparty:music/{track_id}" not in names:
                      raise SystemExit(f"Broken sound event mapping: {event_name}")
                  print(track_id)
          PY
          printf "# Measured from normalized OGG files by FFprobe.\n" > "$duration_file"
          mapfile -t track_ids < "$ids_file"
          for track_id in "${track_ids[@]}"; do
            input="$music_dir/$track_id.ogg"
            output="$music_dir/$track_id.normalized.ogg"
            log="$RUNNER_TEMP/$track_id-decode.log"
            ffmpeg -hide_banner -loglevel error -y -i "$input" \
              -map 0:a:0 -vn -map_metadata -1 \
              -af "loudnorm=I=-14:TP=-1.0:LRA=11" -ac 2 -ar 44100 \
              -c:a libvorbis -q:a 0 "$output"
            test -s "$output"
            mv "$output" "$input"
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$input")"
            [[ "$codec" == "vorbis,44100,2" ]] || { echo "Invalid audio format for $track_id: $codec" >&2; exit 1; }
            ffmpeg -hide_banner -nostats -v info -i "$input" -af volumedetect -f null - 2> "$log"
            mean="$(sed -n 's/.*mean_volume: //p' "$log" | tail -n 1 | awk '{print $1}')"
            [[ -n "$mean" && "$mean" != "-inf" ]] || { echo "No decodable audio signal in $track_id.ogg" >&2; cat "$log" >&2; exit 1; }
            duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input")"
            awk -v d="$duration" 'BEGIN { exit !(d > 0 && d < 3600) }'
            printf "%s=%s\n" "$track_id" "$(awk -v d="$duration" 'BEGIN { printf "%.3f", d }')" >> "$duration_file"
            echo "Validated $track_id.ogg ($codec, $mean dB)"
          done

      - name: Build BlockParty
        working-directory: BlockParty-NeoForge-1.21.1
        run: gradle build --no-daemon

      - name: Verify release JAR contents
        shell: bash
        working-directory: BlockParty-NeoForge-1.21.1
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'blockparty-*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" > "$RUNNER_TEMP/jar-contents.txt"
          grep -Fxq 'assets/blockparty/schematics/xmas.schem.b64' "$RUNNER_TEMP/jar-contents.txt"
          grep -Fxq 'assets/blockparty/music_playlist.json' "$RUNNER_TEMP/jar-contents.txt"
          grep -Fxq 'assets/blockparty/xmas_music_playlist.json' "$RUNNER_TEMP/jar-contents.txt"
          python3 - "$RUNNER_TEMP/jar-contents.txt" <<'PY'
          import json, pathlib, sys
          contents = set(pathlib.Path(sys.argv[1]).read_text().splitlines())
          asset_root = pathlib.Path('src/main/resources/assets/blockparty')
          manifests = ['music_playlist.json', 'xmas_music_playlist.json']
          total = 0
          for manifest in manifests:
              playlist = json.loads((asset_root / manifest).read_text())
              for track in playlist['tracks']:
                  asset = f"assets/blockparty/sounds/music/{track['id']}.ogg"
                  if asset not in contents:
                      raise SystemExit(f"Missing {manifest} music asset: {asset}")
                  total += 1
          print(f"Verified Xmas schematic and {total} tracks across both playlists in the JAR.")
          PY

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockParty-1.4.26-JAR
          path: BlockParty-NeoForge-1.21.1/build/libs/*.jar
          if-no-files-found: error
