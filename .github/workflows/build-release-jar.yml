name: Build BlockParty Release JAR

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/xmas-arena
      - fix/1-1-7-xmas-screen-adventure-spectators

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release sources
        shell: bash
        run: |
          set -euo pipefail
          arena="BlockParty-NeoForge-1.21.1/src/main/java/no/bangerfabrikken/blockparty/arena/Arena.java"
          test -s "$arena"
          test -s BlockParty-NeoForge-1.21.1/src/main/java/no/bangerfabrikken/blockparty/arena/SchematicArenaGenerator.java
          test -s BlockParty-NeoForge-1.21.1/src/main/java/no/bangerfabrikken/blockparty/arena/MusicVotingMenu.java
          test -s BlockParty-NeoForge-1.21.1/src/main/resources/assets/blockparty/schematics/xmas.schem.b64
          grep -q 'mod_version=1.3.8' BlockParty-NeoForge-1.21.1/gradle.properties
          grep -q 'double localX = -10.0 + column * 20.0;' "$arena"
          grep -q 'wallZ + offset' "$arena"
          grep -q 'screenPoint.apply(-23.0)' "$arena"
          grep -q 'ensureXmasPlayableEdges()' "$arena"
          grep -q 'floorWidth != 40 || floorDepth != 40' "$arena"
          grep -q 'MEMORY_FIND_START_TICKS = 160' "$arena"
          grep -q 'getMemoryFindDurationTicks(round)' "$arena"
      - name: Build BlockParty
        working-directory: BlockParty-NeoForge-1.21.1
        run: gradle build --no-daemon

      - name: Verify release JAR contents
        shell: bash
        working-directory: BlockParty-NeoForge-1.21.1
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'blockparty-*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" > "$RUNNER_TEMP/jar-contents.txt"
          grep -Fxq 'assets/blockparty/schematics/xmas.schem.b64' "$RUNNER_TEMP/jar-contents.txt"
          grep -Fxq 'assets/blockparty/music_playlist.json' "$RUNNER_TEMP/jar-contents.txt"
          python3 - "$RUNNER_TEMP/jar-contents.txt" <<'PY'
          import json, pathlib, sys
          contents = set(pathlib.Path(sys.argv[1]).read_text().splitlines())
          playlist = json.loads(pathlib.Path('src/main/resources/assets/blockparty/music_playlist.json').read_text())
          for track in playlist['tracks']:
              asset = f"assets/blockparty/sounds/music/{track['id']}.ogg"
              if asset not in contents:
                  raise SystemExit(f"Missing music asset: {asset}")
          print(f"Verified Xmas schematic and {len(playlist['tracks'])} playlist tracks in the JAR.")
          PY

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockParty-1.3.8-JAR
          path: BlockParty-NeoForge-1.21.1/build/libs/*.jar
          if-no-files-found: error
