modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Bangerfabrikken"
description='''A singleplayer-friendly Block Party minigame for Minecraft 1.21.1. Includes an 80x80 default stadium generator, spectator promenade and stands, a two-sided block-letter target display, a persistent target HUD, 15 timed concrete-color rounds, concrete-only floor tiles, floating one-round beacon power-ups, sidebar scoreboard, elimination lightning, and original round-synchronised music and sound effects.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
